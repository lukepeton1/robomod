# Momentum 2.0 -- Source-style bhop physics.
# Default OBSERVE for safe first-run startup validation; no movement edits
# until explicitly enabled (run the test helper with -Bhop or set active=1).
active=0

# All horizontal units below are Unreal cm/s.
# Genuine CS-style acceleration: the full wish speed determines impulse,
# but directional projection is capped at air_wish_cap. Total speed is NOT
# capped to normal running speed. Mouse + A/D coordination builds speed.
air_acceleration=9.0
air_wish_cap=320.0

# Friction-free window immediately after touching ground (milliseconds).
# A perfect/repeated hop retains previous speed, but waiting on the ground
# longer than this window applies full regular ground friction.
landing_grace_ms=90
ground_acceleration=12.0
ground_friction=7.0
slide_friction=1.15

# No artificial high-speed air drag. Emergency safety limit is not
# ordinary maximum movement speed and should not be used as one.
air_soft_damping=0.0
absolute_speed_cap=30000.0
