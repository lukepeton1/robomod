name: Validate Momentum Research

on:
  push:
    branches:
      - feature/movement-overhaul
    paths:
      - ".github/workflows/validate-momentum.yml"
      - "Source/manifests/movement_patch_targets.txt"
      - "Source/movement/**"
      - "Source/runtime/**"
      - "tools/analyze_movement_seams.py"
      - "tools/analyze_movement_jmap.py"
      - "tools/analyze_calcvelocity_thunk.py"
      - "tools/analyze_native_movement_strings.py"
      - "tools/extract_movement_callgraph.py"
      - "tools/filter_movement_jmap.py"
      - "tools/simulate_movement.py"
      - "tools/windows/collect-movement-handoff.*"
      - "tools/windows/collect-movement-native-handoff.*"
      - "tools/windows/collect-movement-thunk-handoff.*"
      - "tools/windows/run-momentum-runtime-test.*"
      - "tools/windows/run-movement-runtime-probe.*"
      - "tools/windows/cleanup-movement-runtime-probe.*"
      - "tools/windows/momentum-runtime-probe-*.ps1"
      - "tools/windows/test-momentum-staging.ps1"
      - "tests/test_*movement*.py"
      - "tests/cpp/**"
      - "vanilla-json/**"
      - "Docs/MOVEMENT_RESEARCH.md"
      - "Docs/MOVEMENT_DESIGN.md"
      - "Docs/RUNTIME_ARCHITECTURE.md"
      - "research/MOVEMENT_HANDOFF_FINDINGS.md"
      - "research/NATIVE_BINARY_FINDINGS.md"
      - "research/generated/movement_native_surface.json"
      - "research/generated/movement_runtime_surface.json"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Run movement analyzer
        run: |
          python3 tools/analyze_movement_seams.py \
            --output /tmp/movement-seams.json \
            --compat-output /tmp/movement-compatibility.json

      - name: Run movement research tests
        run: python3 -m unittest discover -s tests -p "test_*movement*.py" -v

      - name: Validate reference movement suite
        run: python3 tools/simulate_movement.py --frame-invariance > /tmp/movement-frame-invariance.json

      - name: Compile and run C++ movement core tests
        run: |
          g++ -std=c++20 -O2 \
            Source/runtime/momentum_core.cpp \
            tests/cpp/test_momentum_core.cpp \
            -o /tmp/momentum-core-tests
          /tmp/momentum-core-tests

      - name: Parse runtime-probe PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools/windows -Filter "*.ps1" | Where-Object { $_.Name -match "(?:movement|momentum).*(?:probe|thunk|test)" } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber) col $($_.Extent.StartColumnNumber): $($_.Message) :: $($_.Extent.Text)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Test reversible Momentum staging
        shell: pwsh
        run: ./tools/windows/test-momentum-staging.ps1

      - name: Verify manifest targets exist in committed static JSON
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("vanilla-json/RoboQuest/Content")
          manifest = Path("Source/manifests/movement_patch_targets.txt")
          targets = [
              line.strip()
              for line in manifest.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          duplicates = sorted({x for x in targets if targets.count(x) > 1})
          missing = [x for x in targets if not (root / f"{x}.json").is_file()]
          if duplicates:
              raise SystemExit(f"duplicate manifest targets: {duplicates}")
          if missing:
              raise SystemExit(f"manifest targets missing static JSON: {missing}")
          print(f"validated {len(targets)} movement targets")
          PY
