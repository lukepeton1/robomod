name: Build Momentum Runtime

on:
  push:
    branches:
      - feature/movement-overhaul
    paths:
      - ".github/workflows/build-momentum-runtime.yml"
      - "Source/runtime/native/**"
      - "Source/runtime/momentum_core.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out robomod
        uses: actions/checkout@v4

      - name: Configure standalone runtime
        shell: cmd
        run: cmake -S Source/runtime/native -B build/momentum-native -G "Visual Studio 17 2022" -A x64

      - name: Compile runtime DLL
        shell: cmd
        run: cmake --build build/momentum-native --config Release --target MomentumNative -- /m

      - name: Package runtime mod
        shell: pwsh
        run: |
          $dll = Get-ChildItem build/momentum-native -Recurse -File -Filter MomentumNative.dll | Select-Object -First 1
          if (-not $dll) { throw "MomentumNative.dll missing after build." }
          $root = "artifact/MomentumOverhaul"
          $dlls = Join-Path $root "dlls"
          $scripts = Join-Path $root "Scripts"
          $config = Join-Path $root "config"
          New-Item -ItemType Directory -Force -Path $dlls, $scripts, $config | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $dlls "main.dll") -Force
          Copy-Item Source/runtime/native/Scripts/main.lua (Join-Path $scripts "main.lua") -Force
          Copy-Item Source/runtime/native/config/momentum.ini (Join-Path $config "momentum.ini") -Force
          $dllSha = (Get-FileHash (Join-Path $dlls "main.dll") -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "build_commit=$env:GITHUB_SHA",
            "native_dll_sha256=$dllSha",
            "roboquest_exe_sha256=158487e80be71d5570ca0a1e1a1208ab1c0842daf181f4cb6c98920bc4b4dc1f",
            "calcvelocity_vtable_slot=215",
            "calcvelocity_function_rva=0x02EB5440",
            "mode=observe_by_default"
          ) | Set-Content -LiteralPath (Join-Path $root "runtime-build.txt") -Encoding ascii

      - name: Upload Momentum runtime
        uses: actions/upload-artifact@v4
        with:
          name: MomentumOverhaul-runtime
          path: artifact/MomentumOverhaul
          if-no-files-found: error
